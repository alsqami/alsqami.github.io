<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تحصيلات المستأجرين | مؤسسة سعود علي السقامي للعقارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --orange:#E1712F;
    --orange-dark:#B85423;
    --orange-tint:#FBE9DC;
    --ink:#2E2B27;
    --charcoal:#3A3733;
    --muted:#8A8479;
    --bg:#F3EFE8;
    --surface:#FFFFFF;
    --line:#E6DFD3;
    --success:#3F7D52;
    --success-tint:#E4F1E7;
    --danger:#B3452F;
    --danger-tint:#F7E7E2;
    --warning:#B8791E;
    --warning-tint:#FBEEDA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    font-variant-numeric:tabular-nums;
  }
  #app{min-height:100vh;}
  ::selection{background:var(--orange-tint);}
  input,select,textarea,button{font-family:inherit;font-size:15px;}
  button{cursor:pointer;}
  a{color:inherit;}

  /* ---------- Brand mark ---------- */
  .brandmark{display:flex;align-items:center;gap:10px;}
  .brandmark svg{display:block;flex-shrink:0;}
  .brand-titles{line-height:1.25;}
  .brand-titles .ar{font-weight:800;font-size:15px;color:var(--charcoal);}
  .brand-titles .en{font-weight:700;font-size:11px;color:var(--orange);letter-spacing:.3px;}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 15%, rgba(225,113,47,.08), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(58,55,51,.06), transparent 40%),
      var(--bg);
    padding:24px;
  }
  .login-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    width:100%;max-width:420px;
    padding:36px 32px 30px;
    box-shadow:0 20px 50px -25px rgba(46,43,39,.35);
  }
  .login-head{text-align:center;margin-bottom:26px;}
  .login-head h1{font-size:18px;margin:14px 0 2px;color:var(--charcoal);font-weight:800;}
  .login-head p{margin:0;color:var(--muted);font-size:13px;}
  .role-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--bg);padding:5px;border-radius:12px;}
  .role-tab{
    flex:1;text-align:center;padding:10px 0;border-radius:9px;border:none;background:transparent;
    color:var(--muted);font-weight:700;font-size:14px;transition:.15s;
  }
  .role-tab.active{background:var(--charcoal);color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700;}
  .field select,.field input{
    width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--bg);color:var(--ink);outline:none;transition:.15s;
  }
  .field select:focus,.field input:focus{border-color:var(--orange);background:#fff;}
  .btn{
    border:none;border-radius:10px;padding:12px 18px;font-weight:800;font-size:14.5px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
  }
  .btn-primary{background:var(--orange);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-ghost{background:transparent;color:var(--charcoal);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--charcoal);}
  .btn-dark{background:var(--charcoal);color:#fff;}
  .btn-danger{background:var(--danger-tint);color:var(--danger);}
  .btn-success{background:var(--success-tint);color:var(--success);}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .login-error{
    background:var(--danger-tint);color:var(--danger);border-radius:9px;padding:10px 12px;
    font-size:13px;font-weight:700;margin-bottom:14px;text-align:center;
  }

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;flex-shrink:0;background:var(--charcoal);color:#fff;
    display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
  }
  .sidebar .brand-titles .ar{color:#fff;}
  .side-user{
    margin:20px 0 6px;padding:12px 14px;background:rgba(255,255,255,.06);border-radius:12px;
  }
  .side-user .name{font-weight:800;font-size:14px;}
  .side-user .role{font-size:11.5px;color:#D9C9BB;margin-top:2px;}
  .nav{display:flex;flex-direction:column;gap:4px;margin-top:18px;flex:1;}
  .nav button{
    display:flex;align-items:center;gap:10px;text-align:right;background:transparent;border:none;
    color:#D8D3CC;padding:11px 12px;border-radius:10px;font-weight:700;font-size:13.5px;
    transition:.15s;position:relative;
  }
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav button.active{background:var(--orange);color:#fff;}
  .nav-badge{
    margin-right:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;
    border-radius:20px;padding:1px 7px;
  }
  .logout-btn{
    margin-top:auto;background:rgba(255,255,255,.06);border:none;color:#D8D3CC;
    padding:11px 12px;border-radius:10px;font-weight:700;font-size:13px;text-align:right;
  }
  .logout-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
  .sync-box{margin-top:auto;padding-top:10px;}
  .sync-btn{
    width:100%;background:rgba(225,113,47,.16);border:none;color:#F3C7A6;padding:9px 12px;
    border-radius:9px;font-weight:700;font-size:12.5px;margin-bottom:6px;
  }
  .sync-btn:hover{background:rgba(225,113,47,.28);color:#fff;}
  .sync-time{font-size:10.5px;color:#9A948B;text-align:center;margin-bottom:10px;}
  .version-tag{font-size:10px;color:#7A756D;text-align:center;margin-top:10px;letter-spacing:.3px;}
  .main{flex:1;min-width:0;padding:28px 34px;max-width:1300px;}
  .page-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .page-title h2{margin:0;font-size:21px;font-weight:800;color:var(--charcoal);}
  .page-title p{margin:2px 0 0;color:var(--muted);font-size:13px;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media(max-width:1050px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;
  }
  .stat-card{border-right:4px solid var(--orange);}
  .stat-card .lbl{color:var(--muted);font-size:12.5px;font-weight:700;}
  .stat-card .val{font-size:24px;font-weight:900;color:var(--charcoal);margin-top:6px;}
  .stat-card .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--charcoal);}

  /* ---------- Table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:right;color:var(--muted);font-weight:700;font-size:12px;
    padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;
  }
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.clickable:hover{background:var(--bg);cursor:pointer;}
  .table-wrap{overflow-x:auto;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;}
  .badge-pending{background:var(--warning-tint);color:var(--warning);}
  .badge-approved{background:var(--success-tint);color:var(--success);}
  .badge-rejected{background:var(--danger-tint);color:var(--danger);}
  .badge-neutral{background:var(--orange-tint);color:var(--orange-dark);}
  .muted{color:var(--muted);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-state b{display:block;color:var(--charcoal);font-size:14.5px;margin-bottom:4px;}

  /* ---------- Progress ---------- */
  .progress{background:var(--bg);border-radius:20px;height:9px;overflow:hidden;}
  .progress > div{height:100%;background:var(--orange);border-radius:20px;transition:.3s;}
  .progress.ok > div{background:var(--success);}

  /* ---------- Forms / modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(46,43,39,.5);display:flex;align-items:center;
    justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:var(--surface);border-radius:16px;padding:26px;width:100%;max-width:520px;
    max-height:88vh;overflow:auto;
  }
  .modal.wide{max-width:720px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .modal-head h3{margin:0;font-size:17px;font-weight:800;}
  .modal-close{background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--muted);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.row2{grid-template-columns:1fr;}}
  textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);resize:vertical;min-height:70px;outline:none;}
  textarea:focus,select:focus{border-color:var(--orange);background:#fff;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
  .radio-group{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-opt{
    border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;
    color:var(--muted);flex:1;text-align:center;min-width:110px;
  }
  .radio-opt.sel{border-color:var(--orange);background:var(--orange-tint);color:var(--orange-dark);}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:#fff;
    padding:12px 22px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .pill-tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:16px;width:fit-content;}
  .pill-tab{border:none;background:transparent;padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);}
  .pill-tab.active{background:#fff;color:var(--charcoal);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .icon-btn{background:var(--bg);border:none;width:32px;height:32px;border-radius:8px;color:var(--charcoal);font-size:14px;}
  .icon-btn:hover{background:var(--orange-tint);color:var(--orange-dark);}
  .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer;}
  .alert-row{display:flex;gap:12px;padding:13px 14px;border-radius:10px;margin-bottom:9px;align-items:flex-start;}
  .alert-row.due{background:var(--danger-tint);}
  .alert-row.soon{background:var(--warning-tint);}
  .alert-row .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .alert-row.due .dot{background:var(--danger);}
  .alert-row.soon .dot{background:var(--warning);}
  .filepick{
    border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);
    font-size:13px;font-weight:700;background:var(--bg);
  }
  .filepick.has{border-color:var(--success);color:var(--success);background:var(--success-tint);}
  .file-chip{
    display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;
    background:var(--orange-tint);color:var(--orange-dark);font-weight:800;font-size:12px;
    border:1px solid var(--line);cursor:pointer;
  }
  .file-chip:hover{background:var(--orange);color:#fff;}
  .search-bar{margin-bottom:14px;}
  .search-bar input{
    width:100%;padding:11px 15px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--surface);color:var(--ink);outline:none;font-weight:600;
  }
  .search-bar input:focus{border-color:var(--orange);}
  .dl-link{background:none;border:none;color:var(--orange-dark);font-weight:800;font-size:12px;cursor:pointer;padding:0;}
  .dl-link:hover{text-decoration:underline;}
  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);}
  .kv .v{font-weight:800;}
  .note-item{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .note-item .meta{color:var(--muted);font-size:11px;margin-top:4px;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted);}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Reports / Print ---------- */
  .report-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .report-toolbar select{padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:13px;}
  .print-only{display:none;}
  @media print{
    .sidebar, .no-print{display:none !important;}
    .shell{display:block;}
    .main{padding:0;max-width:100%;}
    body{background:#fff;}
    .print-only{display:block;}
    .card{border:1px solid #ccc;box-shadow:none;break-inside:avoid;}
    table{font-size:11.5px;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading-screen"><div class="spinner"></div><div>جاري تحميل النظام…</div></div></div>

<script>
/* ============================= BRAND MARK ============================= */
function logoSVG(size){
  size = size||34;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none">
    <path d="M50 8 L84 30 V38 L50 17 L16 38 V30 Z" fill="#3A3733"/>
    <path d="M12 42 L50 18 L88 42 V54 L50 30 L12 54 Z" fill="#E1712F"/>
    <path d="M29 50 L46 40 V70 L29 78 Z" fill="none" stroke="#E1712F" stroke-width="6"/>
    <path d="M71 50 L54 40 V70 L71 78 Z" fill="none" stroke="#E1712F" stroke-width="6"/>
    <rect x="46" y="42" width="8" height="46" fill="#3A3733"/>
    <rect x="44" y="30" width="6" height="6" fill="#3A3733"/>
    <rect x="52" y="30" width="6" height="6" fill="#3A3733"/>
  </svg>`;
}
function brandTitles(){
  return `<div class="brand-titles">
    <div class="ar">مؤسسة سعود علي السقامي</div>
    <div class="en">SAUD ALI ALSAQAMI · TAHSILAT</div>
  </div>`;
}

/* ============================= STATE ============================= */
const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function monthKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(mk){ const [y,m]=mk.split('-').map(Number); return MONTHS_AR[m-1]+' '+y; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtMoney(n){ n=Number(n)||0; return n.toLocaleString('en-US',{maximumFractionDigits:0})+' ر.س'; }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('ar-SA-u-nu-latn',{year:'numeric',month:'short',day:'numeric'}); }

const DEFAULT_STATE = {
  supervisors:[
    {id:'sup1', name:'المشرف الأول', password:'Admin@123'},
    {id:'sup2', name:'المشرف الثاني', password:'Admin@123'},
    {id:'sup3', name:'المشرف الثالث', password:'Admin@123'}
  ],
  collectors:[
    {id:'col1', name:'المحصل الأول', password:'1234', phone:''},
    {id:'col2', name:'المحصل الثاني', password:'1234', phone:''},
    {id:'col3', name:'المحصل الثالث', password:'1234', phone:''}
  ],
  tenants:[],   // {id,name,tenantNumber,phone,unit,dueDate,collectorId,monthlyTarget,notes:[{id,text,by,at}],dues:{ '2026-09':[{id,period,dueDate,amount}] },promises:[{id,date,note,createdAt}]}
  payments:[],  // {id,tenantId,collectorId,type,receiptNumber,image,amount,month,submittedAt,status,reviewedBy,reviewedAt,rejectReason}
  notices:[]    // {id,tenantId,collectorId,requestNote,requestedAt,status:'requested'|'issued'|'delivered_pending'|'approved'|'rejected',noticeText,issuedBy,issuedAt,deliveryImage,deliveryNote,deliveredAt,reviewedBy,reviewedAt,rejectReason}
};

let state = null;
let session = null;           // {role:'supervisor'|'collector', id}
let route = 'overview';       // current nav tab
let ui = { detailTenantId:null, loginRole:'supervisor', loginUser:'', loginPass:'', loginError:'' , importPreview:null};
let lastSyncAt = null;
const APP_VERSION = '1.0 (معتمد)';

const STORAGE_KEY = 'tahsilat-app-state-v1';

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){ state = JSON.parse(res.value); ensureShape(); }
    else { state = JSON.parse(JSON.stringify(DEFAULT_STATE)); await persist(); }
  }catch(e){
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    try{ await persist(); }catch(e2){}
  }
  lastSyncAt = new Date();
  render();
  startPolling();
}
function ensureShape(){
  if(!state.supervisors) state.supervisors = JSON.parse(JSON.stringify(DEFAULT_STATE.supervisors));
  if(!state.collectors) state.collectors = JSON.parse(JSON.stringify(DEFAULT_STATE.collectors));
  if(!state.tenants) state.tenants = [];
  if(!state.payments) state.payments = [];
  if(!state.notices) state.notices = [];
  state.tenants.forEach(t=>{ if(!t.notes) t.notes=[]; if(!t.dues) t.dues={}; if(!t.promises) t.promises=[]; if(t.monthlyTarget==null) t.monthlyTarget=0; if(t.tenantNumber==null) t.tenantNumber=''; if(t.unit==null) t.unit=''; if(t.dueDate==null) t.dueDate=''; });
  state.collectors.forEach(c=>{ if(c.phone==null) c.phone=''; });
}
async function persist(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), true); lastSyncAt = new Date(); }
  catch(e){ console.error('storage error', e); }
}
async function saveAndRender(){ await persist(); render(); }

let pollTimer = null;
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(pollForUpdates, 12000);
}
function isRiskyUiState(){
  return !!(ui.showAddTenant || ui.rejectingId || ui.imgViewSrc || ui.noticeImgViewSrc || ui.importPreview || ui.importTenantsPreview || (session && session.role==='collector' && route==='submit'));
}
async function pollForUpdates(force, quiet){
  if(!session) return;
  if(!force && isRiskyUiState()) return;
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      const newStr = res.value;
      if(newStr !== JSON.stringify(state)){
        state = JSON.parse(newStr);
        ensureShape();
        lastSyncAt = new Date();
        if(ui.detailTenantId && !getTenant(ui.detailTenantId)) ui.detailTenantId = null;
        render();
        if(!quiet) showToast('تم تحديث البيانات');
      } else {
        lastSyncAt = new Date();
      }
    }
  }catch(e){ /* silent — will retry next interval */ }
}
async function manualRefresh(){ await pollForUpdates(true, true); showToast('تم التحديث'); }
function showToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}

/* ============================= DATA HELPERS ============================= */
function getTenant(id){ return state.tenants.find(t=>t.id===id); }
function myTenants(collectorId){ return state.tenants.filter(t=>t.collectorId===collectorId); }
function collectorName(id){ const c=state.collectors.find(x=>x.id===id); return c?c.name:'—'; }
function tenantName(id){ const t=getTenant(id); return t?t.name:'—'; }

function approvedPayments(){ return state.payments.filter(p=>p.status==='approved'); }
function pendingPayments(){ return state.payments.filter(p=>p.status==='pending'); }

function collectedForMonth(collectorId, mk){
  return approvedPayments().filter(p=>p.collectorId===collectorId && p.month===mk).reduce((s,p)=>s+Number(p.amount),0);
}
function collectedForTenantMonth(tenantId, mk){
  return approvedPayments().filter(p=>p.tenantId===tenantId && p.month===mk).reduce((s,p)=>s+Number(p.amount),0);
}
function targetForCollectorMonth(collectorId){
  return myTenants(collectorId).reduce((s,t)=>s+Number(t.monthlyTarget||0),0);
}
function lastNMonths(n){
  const arr=[]; const d=new Date();
  for(let i=n-1;i>=0;i--){ const dd=new Date(d.getFullYear(), d.getMonth()-i, 1); arr.push(monthKey(dd)); }
  return arr;
}
function last6Months(){ return lastNMonths(6); }
function tenantDuesTotalForMonth(t, mk){
  const arr = t.dues[mk]||[];
  return arr.reduce((s,d)=>s+Number(d.amount||0),0);
}
function promiseStatus(p){
  const d = new Date(p.date); const now = new Date(todayISO());
  const diffDays = Math.round((d - now)/86400000);
  if(diffDays < 0) return 'due';
  if(diffDays <= 2) return 'soon';
  return 'ok';
}
function collectorAlerts(collectorId){
  const out=[];
  myTenants(collectorId).forEach(t=>{
    (t.promises||[]).forEach(p=>{
      const st = promiseStatus(p);
      if(st==='due'||st==='soon') out.push({tenant:t, promise:p, status:st});
    });
  });
  out.sort((a,b)=> new Date(a.promise.date) - new Date(b.promise.date));
  return out;
}

/* ============================= AUTH ============================= */
function attemptLogin(){
  ui.loginError='';
  const list = ui.loginRole==='supervisor'?state.supervisors:state.collectors;
  const user = list.find(u=>u.id===ui.loginUser);
  if(!user){ ui.loginError='الرجاء اختيار الاسم'; render(); return; }
  if(user.password !== ui.loginPass){ ui.loginError='كلمة المرور غير صحيحة'; render(); return; }
  session = { role: ui.loginRole, id: user.id };
  route = ui.loginRole==='supervisor' ? 'overview' : 'wallet';
  ui.loginPass=''; ui.loginError='';
  render();
}
function logout(){ session=null; ui.loginPass=''; ui.loginError=''; render(); }

/* ============================= RENDER ROOT ============================= */
function render(){
  const app = document.getElementById('app');
  if(!state){ app.innerHTML = `<div class="loading-screen"><div class="spinner"></div><div>جاري تحميل النظام…</div></div>`; return; }
  if(!session){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart==='number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==='number' ? active.selectionEnd : null;
  app.innerHTML = renderShell();
  attachShellEvents();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el && typeof el.focus==='function'){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

function paymentTypeLabel(t){ return {cash:'كاش بالمكتب', platform:'سداد بالمنصة', transfer:'تحويل بنكي'}[t] || t; }
function statusBadge(s){ return {pending:'<span class="badge badge-pending">قيد المراجعة</span>', approved:'<span class="badge badge-approved">معتمد</span>', rejected:'<span class="badge badge-rejected">مرفوض</span>'}[s] || s; }

/* ============================= SEARCH / FILTER HELPERS ============================= */
function matchesTenantSearch(t, q){
  if(!q) return true;
  q = q.trim().toLowerCase();
  if(!q) return true;
  return (t.name||'').toLowerCase().includes(q)
    || (t.phone||'').toLowerCase().includes(q)
    || (t.tenantNumber||'').toLowerCase().includes(q)
    || (t.unit||'').toLowerCase().includes(q);
}
function matchesPaymentSearch(p, q){
  if(!q) return true;
  q = q.trim().toLowerCase();
  if(!q) return true;
  const t = getTenant(p.tenantId);
  return (t && t.name && t.name.toLowerCase().includes(q))
    || (t && t.phone && t.phone.toLowerCase().includes(q))
    || (p.receiptNumber && String(p.receiptNumber).toLowerCase().includes(q));
}

/* ============================= ATTACHMENT (image / PDF) HELPERS ============================= */
function isPdfSrc(src){ return !!src && /^data:application\/pdf/i.test(src); }
function attachmentThumbHTML(src, dataAttr, idVal){
  if(!src) return '';
  if(isPdfSrc(src)) return `<span class="file-chip" data-${dataAttr}="${idVal}" title="اضغط لعرض وتنزيل ملف PDF">📄 PDF</span>`;
  return `<img src="${src}" class="thumb" data-${dataAttr}="${idVal}" title="اضغط لعرض وتنزيل الصورة">`;
}
function attachmentFilenameForPayment(p){
  if(p.imageName) return p.imageName;
  const ext = isPdfSrc(p.image) ? 'pdf' : 'jpg';
  return `ايصال-${p.receiptNumber||p.id}.${ext}`;
}
function receiptCellHTML(p){
  if(!p.receiptNumber && !p.image) return '<span class="muted">—</span>';
  return `${p.receiptNumber?`<div>#${p.receiptNumber}</div>`:''}${p.image?`<div style="margin-top:4px;">${attachmentThumbHTML(p.image,'imgview',p.id)}</div>`:''}`;
}
function downloadDataUrl(dataUrl, filename){
  if(!dataUrl) return;
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename || 'مرفق';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function modalAttachmentView(){
  if(!ui.imgViewSrc) return '';
  const pdf = isPdfSrc(ui.imgViewSrc);
  return `<div class="modal-overlay" id="imgViewOverlay"><div class="modal" style="text-align:center;${pdf?'max-width:760px;':''}">
      ${pdf
        ? `<iframe src="${ui.imgViewSrc}" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;"></iframe>`
        : `<img src="${ui.imgViewSrc}" style="max-width:100%;border-radius:10px;">`}

}

function exportMonthlyReportExcel(mk){
  const summary = state.collectors.map(c=>{
    const col=collectedForMonth(c.id,mk), tgt=targetForCollectorMonth(c.id);
    return { 'المحصل':c.name, 'المستهدف':tgt, 'المحصّل':col, 'النسبة %': tgt?Math.round(col/tgt*100):0, 'الفرق': col-tgt };
  });
  const totalTarget = state.collectors.reduce((s,c)=>s+targetForCollectorMonth(c.id),0);
  const totalCollected = state.collectors.reduce((s,c)=>s+collectedForMonth(c.id,mk),0);
  summary.push({ 'المحصل':'الإجمالي', 'المستهدف':totalTarget, 'المحصّل':totalCollected, 'النسبة %': totalTarget?Math.round(totalCollected/totalTarget*100):0, 'الفرق': totalCollected-totalTarget });

  const details = approvedPayments().filter(p=>p.month===mk).sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt)).map(p=>({
    'المستأجر': tenantName(p.tenantId),
    'المحصل': collectorName(p.collectorId),
    'النوع': paymentTypeLabel(p.type),
    'رقم الإيصال': p.receiptNumber||'',
    'المبلغ': p.amount,
    'تاريخ السداد': p.submittedAt.slice(0,10)
  }));

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(summary);
  XLSX.utils.book_append_sheet(wb, ws1, 'ملخص المحصلين');
  const ws2 = XLSX.utils.json_to_sheet(details.length?details:[{'المستأجر':'لا يوجد سدادات معتمدة لهذا الشهر'}]);
  XLSX.utils.book_append_sheet(wb, ws2, 'تفاصيل السدادات');
  XLSX.writeFile(wb, `تقرير_${mk}.xlsx`);
}

/* ============================= EXCEL IMPORT LOGIC ============================= */
function handleExcelUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {defval:''});
      const rows = json.map(r=>{
        const name = String(r['اسم المستأجر']||r['المستأجر']||r['name']||'').trim();
        let period = String(r['الفترة']||r['period']||'').trim() || monthKey();
        let dueDate = r['تاريخ الاستحقاق']||r['dueDate']||'';
        if(dueDate instanceof Date) dueDate = dueDate.toISOString().slice(0,10);
        else dueDate = String(dueDate).trim();
        const amount = Number(r['المبلغ']||r['amount']||0);
        const tenant = state.tenants.find(t=>t.name.trim()===name);
        return { name, period, dueDate, amount, tenantId: tenant? tenant.id : null };
      }).filter(r=>r.name);
      ui.importPreview = { rows };
      render();
    }catch(err){ showToast('تعذّر قراءة الملف، تأكد من التنسيق'); }
  };
  reader.readAsArrayBuffer(file);
}
function downloadTemplate(){
  const ws = XLSX.utils.json_to_sheet([
    {'اسم المستأجر':'محمد عبدالله', 'الفترة':monthKey(), 'تاريخ الاستحقاق':todayISO(), 'المبلغ':2000}
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'المطالبات');
  XLSX.writeFile(wb, 'نموذج_استيراد_المطالبات.xlsx');
}
function handleTenantsExcelUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {defval:''});
      const rows = json.map(r=>{
        const tenantNumber = String(r['رقم المستأجر']||r['رقم']||r['tenantNumber']||'').trim();
        const name = String(r['اسم المستأجر']||r['المستأجر']||r['name']||'').trim();
        const phone = String(r['رقم الجوال']||r['الجوال']||r['phone']||'').trim();
        const unit = String(r['العقار والوحدة']||r['العقار']||r['الوحدة']||r['unit']||'').trim();
        let dueDate = r['تاريخ الاستحقاق']||r['الاستحقاق']||r['dueDate']||'';
        if(dueDate instanceof Date) dueDate = dueDate.toISOString().slice(0,10);
        else dueDate = String(dueDate).trim();
        const collectorName = String(r['المحصل']||r['collector']||'').trim();
        const target = Number(r['الهدف الشهري']||r['الهدف']||r['target']||0);
        const notes = String(r['ملاحظات']||r['notes']||'').trim();
        const collector = state.collectors.find(c=>c.name.trim()===collectorName);
        return { tenantNumber, name, phone, unit, dueDate, collectorName, target, notes, collectorId: collector? collector.id : null };
      }).filter(r=>r.name);
      ui.importTenantsPreview = { rows };
      render();
    }catch(err){ showToast('تعذّر قراءة الملف، تأكد من التنسيق'); }
  };
  reader.readAsArrayBuffer(file);
}

/* ============================= SUBMIT PAYMENT LOGIC ============================= */
function handleReceiptImage(e){
  const file = e.target.files[0]; if(!file) return;
  if(file.size > 5*1024*1024){ showToast('حجم الملف كبير جدًا (الحد الأقصى 5MB)'); return; }
  const okType = file.type.startsWith('image/') || file.type==='application/pdf' || /\.pdf$/i.test(file.name);
  if(!okType){ showToast('الرجاء اختيار صورة أو ملف PDF فقط'); return; }
  const reader = new FileReader();
  reader.onload = (ev)=>{ ui.subImagePreview = ev.target.result; ui.subImageFileName = file.name; render(); };
  reader.readAsDataURL(file);
}
function handleNoticeImage(e){
  const file = e.target.files[0]; if(!file) return;
  if(file.size > 3*1024*1024){ showToast('حجم الصورة كبير جدًا (الحد الأقصى 3MB)'); return; }
  const reader = new FileReader();
  reader.onload = (ev)=>{ ui.noticeImagePreview = ev.target.result; ui.noticeImageFileName = file.name; render(); };
  reader.readAsDataURL(file);
}
async function submitPayment(){
  const tenantId = document.getElementById('subTenant').value;
  const amount = Number(document.getElementById('subAmount').value);
  const month = document.getElementById('subMonth').value.trim() || monthKey();
  const type = ui.submitType || 'cash';
  const receipt = document.getElementById('subReceipt').value.trim();
  const image = ui.subImagePreview || null;

  if(!tenantId){ showToast('الرجاء اختيار المستأجر'); return; }
  if(!amount || amount<=0){ showToast('الرجاء إدخال مبلغ صحيح'); return; }
  if(type==='cash' && !receipt){ showToast('كاش بالمكتب يتطلب رقم الإيصال'); return; }
  if(type!=='cash' && !receipt && !image){ showToast('يتطلب رقم الإيصال أو صورة الإيصال'); return; }

  state.payments.push({
    id: uid(), tenantId, collectorId: session.id, type, receiptNumber: receipt||null, image,
    imageName: ui.subImageFileName || null,
    amount, month, submittedAt: new Date().toISOString(), status:'pending'
  });
  ui.submitType='cash'; ui.subImagePreview=null; ui.subImageFileName=null;
  await persist();
  showToast('تم إرسال السداد للمراجعة');
  route='mypayments'; render();
}
